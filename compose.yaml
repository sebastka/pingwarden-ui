# A local Pingwarden for development and the integration tests (the UI itself runs with
# `npm run dev`):
#   npm run dev:pingwarden    Pingwarden + PostgreSQL + a mock OIDC provider
#
#   Pingwarden API   http://localhost:${DEV_PINGWARDEN_PORT:-8081}  (tokens in dev/pingwarden/00-server.yaml)
#   OIDC issuer      http://localhost:${MOCK_OIDC_PORT:-8090}/default
#
# Pingwarden accepts http:// issuer and JWKS URLs on localhost only. So Pingwarden runs in the
# network namespace of the mock provider: both reach it as localhost:8080, and the published
# port makes the issuer http://localhost:8090/default for the browser and the UI server too.
# Images are pinned by digest (multi-arch index); Dependabot keeps them current.
services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2@sha256:94d4ebf0fe793a727b3468b846e92ccbcd513f3b359a095802d817934d762e01
    restart: unless-stopped
    environment:
      JSON_CONFIG_PATH: /config/mock-oidc.json
    volumes:
      - ./dev/mock-oidc.json:/config/mock-oidc.json:ro
    # Lets Pingwarden's unprivileged user (GID 65532) send ICMP echo requests; network sysctls
    # belong to the namespace's owner, which is this container.
    sysctls:
      net.ipv4.ping_group_range: '65532 65532'
    # Loopback, never CONTAINER_HOST_ADDRESS: the issuer has to be http://localhost:… (above).
    ports:
      - '127.0.0.1:${MOCK_OIDC_PORT:-8090}:8080'
      - '127.0.0.1:${DEV_PINGWARDEN_PORT:-8081}:8081'

  pingwarden:
    # PINGWARDEN_IMAGE runs another build, e.g. one made from a Pingwarden checkout.
    image: ${PINGWARDEN_IMAGE:-ghcr.io/sebastka/pingwarden:edge@sha256:e85c709f61b88ae92eb25bd4fc5112ecd798fd0739fceff76816be0a6bbdfc61}
    restart: unless-stopped
    network_mode: service:mock-oidc
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-pingwarden}
      MOCK_OIDC_PORT: ${MOCK_OIDC_PORT:-8090}
    volumes:
      - ./dev/pingwarden:/etc/pingwarden:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: pingwarden
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-pingwarden}
      POSTGRES_DB: pingwarden
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'pingwarden']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
